[package]
name = "illusion"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
hide_uefi_memory = []

[[bin]]
name = "illusion"
path = "src/main.rs"

[dependencies]
# We intentionally do NOT enable the `alloc` feature here. The `hypervisor`
# crate provides its own `#[global_allocator]` (a 64 MB linked-list heap).
# Enabling `alloc` in the `uefi` crate would also provide a global
# allocator, which Rust forbids (E0152 conflicts with `hypervisor`'s).
# We still depend on the standard `alloc` crate directly via
# `extern crate alloc;` in `src/main.rs` for `Box`/`Vec`/`String` types.
uefi = { version = "0.30.0" } # https://crates.io/crates/uefi
log = { version = "0.4.20", default-features = false } # https://crates.io/crates/log
once_cell = "1.19.0" # https://crates.io/crates/once_cell
spin = "0.9" # https://crates.io/crates/spin
com_logger = "0.1.1" # https://crates.io/crates/com_logger
hypervisor = { path = "../hypervisor", features = ["vmware", "hide_hv_with_ept"] }