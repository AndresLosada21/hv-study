name: Build Illusion Hypervisor

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Rust nightly + UEFI target
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          targets: x86_64-unknown-uefi

      - name: Cache cargo (illusion-rs)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: illusion-rs -> target

      - name: Build UEFI (illusion + loader)
        shell: pwsh
        run: |
          cd illusion-rs
          cargo build --release --target x86_64-unknown-uefi -p illusion -p loader

      - name: Build Windows (client + xtask)
        shell: pwsh
        run: |
          cd illusion-rs
          cargo build --release --target x86_64-pc-windows-msvc -p client -p xtask

      - name: Upload Release Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: illusion-rs-release
          path: |
            illusion-rs/target/x86_64-unknown-uefi/release/illusion.efi
            illusion-rs/target/x86_64-unknown-uefi/release/loader.efi
            illusion-rs/target/x86_64-pc-windows-msvc/release/client.exe
            illusion-rs/target/x86_64-pc-windows-msvc/release/xtask.exe
          if-no-files-found: error

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: illusion-rs-build-logs
          path: illusion-rs/target/**/*.log
          if-no-files-found: ignore
