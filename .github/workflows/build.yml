name: Build Driver

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install WDK
      shell: pwsh
      run: |
        # Download WDK 10 (22H2) directly from Microsoft
        $wdkUrl = "https://go.microsoft.com/fwlink/?linkid=2196230"
        $wdkInstaller = "$env:TEMP\wdksetup.exe"
        Write-Host "Downloading WDK..."
        Invoke-WebRequest -Uri $wdkUrl -OutFile $wdkInstaller -UseBasicParsing
        Write-Host "Installing WDK (silent)..."
        Start-Process -FilePath $wdkInstaller -ArgumentList "/quiet /norestart" -Wait
        Write-Host "WDK installed."
        # Refresh PATH
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

    - name: Build (NT x64 Release)
      shell: pwsh
      run: |
        cd SimpleVisor
        msbuild shv.sln /p:Configuration="NT" /p:Platform=x64 /p:ConfigurationType=Driver /m /verbosity:minimal

    - name: Upload Driver Artifact
      uses: actions/upload-artifact@v4
      with:
        name: shv-driver
        path: |
          SimpleVisor/x64/**/*.sys
          SimpleVisor/x64/**/*.pdb
        if-no-files-found: warn

    - name: Upload Build Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: SimpleVisor/x64/**/*.log
        if-no-files-found: ignore
