name: Build Driver

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install WDK
      shell: pwsh
      run: |
        # Download WDK 10 (22H2) directly from Microsoft
        $wdkUrl = "https://go.microsoft.com/fwlink/?linkid=2196230"
        $wdkInstaller = "$env:TEMP\wdksetup.exe"
        Write-Host "Downloading WDK..."
        Invoke-WebRequest -Uri $wdkUrl -OutFile $wdkInstaller -UseBasicParsing
        Write-Host "Installing WDK (silent)..."
        Start-Process -FilePath $wdkInstaller -ArgumentList "/quiet /norestart" -Wait
        Write-Host "WDK installed."
        # Refresh PATH
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

    - name: Build (Windows NT x64)
      shell: pwsh
      run: |
        # Set INCLUDE and LIB paths for WDK (find latest version with km folder)
        $wdkRoot = "C:\Program Files (x86)\Windows Kits\10"
        $wdkVer = Get-ChildItem "$wdkRoot\Include" -Directory |
          Where-Object { Test-Path "$wdkRoot\Include\$($_.Name)\km\ntifs.h" } |
          Sort-Object Name -Descending |
          Select-Object -First 1 -ExpandProperty Name
        if ($wdkVer) {
          $includePaths = @(
            "$wdkRoot\Include\$wdkVer\km",
            "$wdkRoot\Include\$wdkVer\shared",
            "$wdkRoot\Include\$wdkVer\ucrt",
            "$wdkRoot\Include\$wdkVer\um",
            "$wdkRoot\Include\$wdkVer\winrt"
          ) -join ";"
          $env:INCLUDE = $includePaths + ";" + $env:INCLUDE
          $env:LIB = "$wdkRoot\Lib\$wdkVer\km\x64;$wdkRoot\Lib\$wdkVer\ucrt\x64;" + $env:LIB
          Write-Host "WDK version: $wdkVer"
          Write-Host "INCLUDE set to: $includePaths"
        } else {
          Write-Host "ERROR: WDK not found"
          exit 1
        }
        cd SimpleVisor
        msbuild shv.sln /p:Configuration="Windows NT" /p:Platform=x64 /m /verbosity:minimal

    - name: Upload Driver Artifact
      uses: actions/upload-artifact@v4
      with:
        name: shv-driver
        path: |
          SimpleVisor/x64/**/*.sys
          SimpleVisor/x64/**/*.pdb
        if-no-files-found: warn

    - name: Upload Build Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: SimpleVisor/x64/**/*.log
        if-no-files-found: ignore
