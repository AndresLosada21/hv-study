name: Build Driver

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install Windows SDK 10.0.28000
      shell: pwsh
      run: |
        # SDK 10.0.28000 (para VS 2026 / MSBuild v18)
        # https://learn.microsoft.com/en-us/windows-hardware/drivers/download-the-wdk
        $sdkUrl = "https://go.microsoft.com/fwlink/?linkid=2372508"
        $sdkInstaller = "$env:TEMP\winsdksetup.exe"
        Write-Host "Downloading Windows SDK 10.0.28000..."
        Invoke-WebRequest -Uri $sdkUrl -OutFile $sdkInstaller -UseBasicParsing
        Write-Host "Installing Windows SDK (silent)..."
        Start-Process -FilePath $sdkInstaller -ArgumentList "/quiet /norestart" -Wait
        Write-Host "Windows SDK installed."

    - name: Install WDK 28000
      shell: pwsh
      run: |
        # WDK para VS 2026 (build 28000) - tem Microsoft.DriverKit.Build.Tasks.18.0.dll
        $wdkUrl = "https://go.microsoft.com/fwlink/?LinkId=2371554"
        $wdkInstaller = "$env:TEMP\wdksetup.exe"
        Write-Host "Downloading WDK..."
        Invoke-WebRequest -Uri $wdkUrl -OutFile $wdkInstaller -UseBasicParsing
        Write-Host "Installing WDK (silent)..."
        Start-Process -FilePath $wdkInstaller -ArgumentList "/quiet /norestart" -Wait
        Write-Host "WDK installed."
        # Refresh PATH
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

    - name: Build (Windows NT x64)
      shell: pwsh
      run: |
        # Pin do WindowsTargetPlatformVersion na versao do WDK instalado.
        # Sem isso, o projeto usa $(LatestTargetPlatformVersion), que resolve
        # para o SDK mais novo do runner (sem headers km\ como ntifs.h).
        # Com o pin, os props do toolset WindowsKernelModeDriver10.0 montam
        # IncludePath/LibraryPath corretamente (nao precisa hack de INCLUDE).
        cd SimpleVisor
        msbuild shv.sln /p:Configuration="Windows NT" /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0.28000.0 /p:SignMode=Off /m /verbosity:minimal

    - name: Upload Driver Artifact
      uses: actions/upload-artifact@v4
      with:
        name: shv-driver
        path: |
          SimpleVisor/x64/**/*.sys
          SimpleVisor/x64/**/*.pdb
        if-no-files-found: warn

    - name: Upload Build Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: SimpleVisor/x64/**/*.log
        if-no-files-found: ignore
