name: Build Driver

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install Windows SDK 10.0.22621
      shell: pwsh
      run: |
        # SDK 10.0.22621 (parte um/ucrt/shared + registro do Windows Kits).
        # Sem ele, o MSBuild falha com MSB8036 ("Windows SDK version not found").
        $sdkUrl = "https://go.microsoft.com/fwlink/?linkid=2311806"
        $sdkInstaller = "$env:TEMP\winsdksetup.exe"
        Write-Host "Downloading Windows SDK 10.0.22621..."
        Invoke-WebRequest -Uri $sdkUrl -OutFile $sdkInstaller -UseBasicParsing
        Write-Host "Installing Windows SDK (silent)..."
        Start-Process -FilePath $sdkInstaller -ArgumentList "/quiet /norestart" -Wait
        Write-Host "Windows SDK installed."

    - name: Install WDK
      shell: pwsh
      run: |
        # WDK 10.0.22621 (22H2): headers/libs de kernel (km\ntifs.h etc.)
        $wdkUrl = "https://go.microsoft.com/fwlink/?linkid=2196230"
        $wdkInstaller = "$env:TEMP\wdksetup.exe"
        Write-Host "Downloading WDK..."
        Invoke-WebRequest -Uri $wdkUrl -OutFile $wdkInstaller -UseBasicParsing
        Write-Host "Installing WDK (silent)..."
        Start-Process -FilePath $wdkInstaller -ArgumentList "/quiet /norestart" -Wait
        Write-Host "WDK installed."
        # Refresh PATH
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

    - name: Build (Windows NT x64)
      shell: pwsh
      run: |
        # Pin do WindowsTargetPlatformVersion na versao do WDK instalado.
        # Sem isso, o projeto usa $(LatestTargetPlatformVersion), que resolve
        # para o SDK mais novo do runner (sem headers km\ como ntifs.h).
        # Com o pin, os props do toolset WindowsKernelModeDriver10.0 montam
        # IncludePath/LibraryPath corretamente (nao precisa hack de INCLUDE).
        cd SimpleVisor
        msbuild shv.sln /p:Configuration="Windows NT" /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0.22621.0 /m /verbosity:minimal

    - name: Upload Driver Artifact
      uses: actions/upload-artifact@v4
      with:
        name: shv-driver
        path: |
          SimpleVisor/x64/**/*.sys
          SimpleVisor/x64/**/*.pdb
        if-no-files-found: warn

    - name: Upload Build Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: SimpleVisor/x64/**/*.log
        if-no-files-found: ignore
