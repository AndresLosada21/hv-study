name: Build Driver

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install WDK
      shell: pwsh
      run: |
        # Install Windows Driver Kit via winget
        winget install --id Microsoft.WindowsWDK.10 --accept-package-agreements --accept-source-agreements
        # Refresh PATH
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

    - name: Build (NT x64 Release)
      shell: pwsh
      run: |
        cd SimpleVisor
        msbuild shv.sln /p:Configuration="NT" /p:Platform=x64 /p:ConfigurationType=Driver /m /verbosity:minimal

    - name: Upload Driver Artifact
      uses: actions/upload-artifact@v4
      with:
        name: shv-driver
        path: |
          SimpleVisor/x64/**/*.sys
          SimpleVisor/x64/**/*.pdb
        if-no-files-found: warn

    - name: Upload Build Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: SimpleVisor/x64/**/*.log
        if-no-files-found: ignore
